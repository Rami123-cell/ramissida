blocks:[
{h:'Kylprocessen i korthet',html:`<p>Ett kylsystem flyttar värme från en plats med låg temperatur till en plats med högre temperatur. Det görs av ett köldmedium som cirkulerar i en sluten krets och växlar mellan vätska och gas.</p>
<ol class="steps"><li><b>Kompression.</b> Kompressorn suger in gas och höjer tryck och temperatur.</li><li><b>Kondensering.</b> Kondensorn avger värme och gasen blir vätska.</li><li><b>Expansion.</b> Expansionsventilen sänker trycket och doserar flödet.</li><li><b>Förångning.</b> Förångaren tar upp värme och vätskan blir gas igen.</li></ol>`},
{h:'Direkta system',html:`<p>I ett direkt system förångas köldmediet i en förångare som sitter i det utrymme eller luftflöde som ska kylas. Exempel är split-luftkonditionering och kylrum med luftkylare.</p><p><b>Fördelar:</b> få komponenter och hög verkningsgrad. <b>Nackdelar:</b> stor mängd köldmedium och långa rörledningar där köldmedium kan läcka ut.</p>`},
{h:'Delvis indirekta system',html:`<p>I ett delvis indirekt system används en köldbärare, till exempel vatten-glykol, på en av sidorna. Oftast kyler förångaren köldbäraren, som pumpas ut till kylbehovet. Kondensorn kan vara luftkyld.</p>`},
{h:'Fullständigt indirekta system',html:`<p>I ett fullständigt indirekt system finns köldbärare på både kalla och varma sidan. Köldmediet stannar i ett kompakt aggregat, ofta i ett maskinrum eller utomhus. Ett exempel är ett vätskekylaggregat som kyler vatten-glykol, som pumpas ut till kylbatterier.</p>
<div class="tblwrap"><table><thead><tr><th>System</th><th>Köldbärare</th><th>Mängd köldmedium</th><th>Exempel</th></tr></thead><tbody>
<tr><td>Direkt</td><td>Ingen</td><td>Stor</td><td>Split-luftkonditionering</td></tr>
<tr><td>Delvis indirekt</td><td>På en sida</td><td>Mindre</td><td>Vätskekylaggregat för processkyla</td></tr>
<tr><td>Fullständigt indirekt</td><td>På båda sidor</td><td>Minst</td><td>Vätskekylaggregat med kylbatterier</td></tr></tbody></table></div>
<p>Indirekta system kräver en extra värmeväxlare och en pump. Det ger energiförluster, men ger också säkrare hantering när köldmediet är brandfarligt eller giftigt.</p>
<div class="note">Begreppen används något olika i läroböcker. I den här kursen betyder delvis indirekt köldbärare på en sida och fullständigt indirekt köldbärare på båda sidor. Följ din lärares definition om den skiljer sig.</div>`}],
links:['skolverket','skvp'],
mcq:[

{q:'Vad kännetecknar ett indirekt system?',o:['En köldbärare, till exempel glykol, transporterar kylan ut','Köldmediet pumpas ut i hela lokalen','Det saknar kompressor','Det saknar förångare'],a:0,t:'Indirekta system',e:'Köldmediet kyler köldbäraren, och köldbäraren transporterar kylan ut.'},
{q:'Vilket system innehåller oftast mest köldmedium?',o:['Indirekt system','Direkt system','Båda lika mycket','Inget av dem'],a:1,t:'Mängd köldmedium',e:'Ett direkt system har köldmedium i långa rör ut till förångaren.'},
{q:'Vad används som köldbärare i ett indirekt system?',o:['Smörjolja','Kvävgas','Köldmedium R404A','Vatten med glykol'],a:3,t:'Köldbärare',e:'Vatten med glykol är vanligt eftersom det inte fryser.'},
{q:'Vad är en nackdel med ett indirekt system?',o:['Det ger sämre arbetsmiljö','Det behöver extra värmeväxlare och pump','Det kan inte kyla alls','Det kräver mer köldmedium'],a:1,t:'Nackdelar med indirekta system',e:'Extra värmeväxlare och pump ger energiförluster.'}],

<tr><td>Pressostat (HP/LP)</td><td>Stoppar kompressorn vid för högt eller för lågt tryck.</td></tr></tbody></table></div>`},
{h:'Material och hållbarhet',html:`<p>Material måste passa köldmedium, olja och köldbärare. Koppar är vanligt med HFC-köldmedier. Ammoniak (R717) angriper koppar och kopparlegeringar, därför används stål i ammoniakanläggningar. Ett rent och torrt system ger lång livslängd.</p>`},
{h:'Korrosion och skydd',html:`<ul><li><b>Invändigt:</b> fukt i systemet kan tillsammans med köldmedium och olja bilda syror. Skydd: evakuera ordentligt (vakuum) och använd filtertork.</li>
<li><b>Utvändigt:</b> kondens och fukt under isolering ger korrosion. Skydd: hel ångspärr, målning eller galvanisering.</li>
<li><b>Galvanisk korrosion:</b> uppstår mellan olika metaller i kontakt med fukt. Skydd: rätt materialval och isolerande skarvar.</li>
<li><b>Köldbärare:</b> vatten-glykol innehåller korrosionsinhibitorer som förbrukas med tiden. Koncentrationen ska kontrolleras.</li></ul>`},
{h:'Mekanisk påverkan',html:`<ul><li>Vibrationer från kompressorn kan ge utmattning och rörbrott. Använd vibrationsdämpare och rörstöd.</li><li>Rör växer och krymper med temperaturen. Planera rörböjar och fixpunkter.</li><li>Vätskeslag i kompressorn ger mekaniska skador.</li></ul>
<div class="note">Konstruktion och säkerhet för kylsystem styrs av standarden SS-EN 378 och EU:s regler för tryckbärande anordningar. Arbetsmiljöverket har föreskrifter om tryckbärande anordningar (AFS 2023:5).</div>`}],

MODS.push({id:'m3',short:'Köldmedier',title:'Köldmedier och miljö',
intro:'Du lär dig vad GWP och ODP betyder, hur utsläpp räknas om till koldioxidekvivalenter och vilka regler som gäller för läckagekontroll och behörighet.',
blocks:[
{h:'Varför regleras köldmedier?',html:`<p>Äldre köldmedier som CFC och HCFC bröt ned ozonskiktet och fasades ut enligt Montrealprotokollet. Många av ersättarna, HFC, är kraftiga växthusgaser. EU-förordning 2024/573 om fluorerade växthusgaser (F-gaser) ersatte förordning 517/2014. Syftet är att fasa ut F-gaser med hög klimatpåverkan och ersätta dem med alternativ med lägre påverkan. Naturvårdsverket är tillsynsvägledande myndighet i Sverige.</p>`},
{h:'GWP, ODP och säkerhetsklass',html:`<p><b>ODP</b> anger hur mycket ett ämne bryter ned ozonskiktet. <b>GWP</b> anger klimatpåverkan jämfört med samma mängd koldioxid. Säkerhetsklassen har en bokstav för giftighet (A lägre, B högre) och en siffra för brandfarlighet (1 ingen, 2L svag, 2 brandfarlig, 3 högbrandfarlig).</p>
<div class="tblwrap"><table><thead><tr><th>Köldmedium</th><th>Typ</th><th>GWP (ungefär)</th><th>Säkerhetsklass</th></tr></thead><tbody>
<tr><td>R134a</td><td>HFC</td><td class="num">1 400</td><td>A1</td></tr>
<tr><td>R404A</td><td>HFC-blandning</td><td class="num">3 900</td><td>A1</td></tr>
<tr><td>R410A</td><td>HFC-blandning</td><td class="num">2 100</td><td>A1</td></tr>
<tr><td>R32</td><td>HFC</td><td class="num">700</td><td>A2L</td></tr>
<tr><td>R290 (propan)</td><td>Naturligt</td><td class="num">3</td><td>A3</td></tr>
<tr><td>R744 (koldioxid)</td><td>Naturligt</td><td class="num">1</td><td>A1</td></tr>
<tr><td>R717 (ammoniak)</td><td>Naturligt</td><td class="num">0</td><td>B2L</td></tr></tbody></table></div>
<p>GWP-värdena skiljer sig något mellan olika rapporter. Vid beräkning av krav används värdena i förordningens bilagor.</p>`},
{h:'Räkna koldioxidekvivalenter (CO₂e)',html:`<p class="mono">CO₂e (ton) = mängd (kg) × GWP ÷ 1000</p><p>Exempel: 20 kg med GWP 3 900 ger 20 × 3 900 ÷ 1000 = 78 ton CO₂e.</p>`},
{h:'Läckagekontroll',html:`<p>Hur ofta en anläggning ska läckagekontrolleras beror på mängden i CO₂e. I stora drag gäller för system utan läckagevarningssystem: från 5 ton minst en gång per år, från 50 ton var sjätte månad och från 500 ton var tredje månad. Med läckagevarningssystem blir intervallen längre. Om ett läckage upptäcks ska det åtgärdas omgående och en ny läckagekontroll göras inom en månad. För vissa nyare ämnen räknas gränserna i kilogram.</p>
<div class="note warn">Detta är en förenkling. Kontrollera alltid Naturvårdsverkets aktuella tabell för läckagekontroll. Den svenska förordningen anpassas fortfarande efter EU-förordningen.</div>`},
{h:'Behörighet och dokumentation',html:`<ul><li>Den som utför läckagekontroll, installation, service eller återvinning av köldmedium ska vara personcertifierad. I Sverige görs examinationen hos godkända examinationscentra.</li>
<li>Operatören, det vill säga den som äger eller driver anläggningen, för register över typ och mängd köldmedium, påfyllning, återvinning och utförda kontroller.</li>
<li>Köldmedium får inte släppas ut. Det ska tas om hand och återvinnas.</li></ul>`}],

blocks:[
{h:'Risker med köldmedier',html:`<div class="tblwrap"><table><thead><tr><th>Risk</th><th>Förklaring</th></tr></thead><tbody>
<tr><td>Kvävning</td><td>Koldioxid och de flesta köldmediegaser är tyngre än luft och samlas lågt i slutna utrymmen. Det kan ge syrebrist.</td></tr>
<tr><td>Giftighet</td><td>Ammoniak irriterar ögon och luftvägar och är giftig. Gasdetektor och andningsskydd behövs.</td></tr>
<tr><td>Brand och explosion</td><td>Propan (R290) är högbrandfarligt. Undvik tändkällor och använd gnistfri utrustning.</td></tr>

<tr><td>Hög temperatur</td><td>Vissa fluorerade köldmedier kan sönderfalla till frätande ämnen vid brand eller mycket hög temperatur.</td></tr></tbody></table></div>`},
{h:'Köldbärare och oljor',html:`<ul><li><b>Etylenglykol</b> är giftigt vid förtäring. <b>Propylenglykol</b> är mindre giftigt. <b>Etanol</b> är brandfarligt.</li>
<li>Kylmaskinoljor kan irritera hud och ögon. Syntetiska oljor tar lätt upp fukt ur luften och ska hållas tillslutna.</li>

<li>Säkra god ventilation, gasdetektorer och tillgång till ögondusch där det behövs.</li>
<li>Använd rätt personlig skyddsutrustning: skyddsglasögon, handskar och vid behov andningsskydd.</li></ul>`}],

MODS.push({id:'m5',short:'Drift & läcksökning',title:'Driftövervakning och läcksökning',
intro:'Du lär dig vilka tryck och temperaturer som övervakas, vilka skyddsfunktioner som finns och hur man läcksöker säkert.',
blocks:[
{h:'Vad ska övervakas?',html:`<ul><li><b>Tryck:</b> lågtryck (sugsidan) och högtryck med manometrar eller tryckgivare.</li><li><b>Temperatur:</b> sugledning, vätskeledning, tryckledning, luft eller köldbärare.</li><li><b>Övrigt:</b> oljenivå, siktglas, ljud, vibrationer och avfrostning.</li></ul>
<p>För ett givet köldmedium hör ett visst tryck ihop med en bestämd mättnadstemperatur. Därför kan man räkna om ett uppmätt tryck till förångnings- eller kondenseringstemperatur med en tryck-temperaturtabell.</p>`},
{h:'Skyddsfunktioner',html:`<p>En <b>HP-pressostat</b> stoppar kompressorn vid för högt tryck. En <b>LP-pressostat</b> stoppar den vid för lågt sugtryck, till exempel vid läckage. Larm och läckagevarningssystem ger tidig varning.</p>`},
{h:'Metoder för läcksökning',html:`<div class="tblwrap"><table><thead><tr><th>Metod</th><th>Observera</th></tr></thead><tbody>
<tr><td>Visuell kontroll</td><td>Oljespår vid skarvar och kopplingar tyder ofta på läckage.</td></tr>
<tr><td>Elektronisk läcksökare</td><td>Känner av köldmedium i luften. Sök långsamt och undvik drag.</td></tr>
<tr><td>Läcksökningsspray eller tvålvatten</td><td>Bubblor visar läckan.</td></tr>
<tr><td>UV-färg</td><td>Tillsats i oljan som lyser under UV-lampa.</td></tr>
<tr><td>Tryckprovning med torr kvävgas</td><td>Trycksänkning över tid visar läckage.</td></tr>
<tr><td>Vakuumprov</td><td>Evakuera och kontrollera att trycket inte stiger.</td></tr></tbody></table></div>`},
{h:'Säker tryckprovning',html:`<div class="note warn">Använd torr kvävgas med reduceringsventil och säkerhetsventil. Använd aldrig syre eller tryckluft. Syre tillsammans med olja under tryck kan ge brand eller explosion. Provtrycket får inte överstiga anläggningens tillåtna tryck.</div>`}],

MODS.push({id:'m6',short:'Överhettning & egenkontroll',title:'Överhettning, underkylning och egenkontroll',
intro:'Du lär dig mäta och tolka överhettning och underkylning och veta vad en egenkontroll av ett kyl- eller värmepumpsaggregat innehåller.',
blocks:[
{h:'Överhettning och underkylning',html:`<p><b>Överhettning (ÖH)</b> är hur många grader gasen är varmare än förångningstemperaturen vid sugtrycket. Den visar att allt köldmedium hunnit förångas innan kompressorn.</p><p class="mono">ÖH = sugledningstemperatur − förångningstemperatur</p>
<p><b>Underkylning (UK)</b> är hur många grader vätskan är kallare än kondenseringstemperaturen. Den visar att vätskan är fri från bubblor före expansionsventilen.</p><p class="mono">UK = kondenseringstemperatur − vätsketemperatur</p>
<p>Skillnader anges i kelvin (K). Riktvärden är ofta 5–10 K för överhettning och 3–8 K för underkylning, men följ alltid tillverkarens anvisningar.</p>
<div class="note">För köldmedieblandningar med temperaturglid räknas överhettning från daggpunkten och underkylning från bubbelpunkten.</div>`},
{h:'Så mäter du',html:`<ol class="steps"><li>Anslut manometer på lågtrycks- och högtryckssidan.</li><li>Läs av trycken och räkna om dem till mättnadstemperaturer med tryck-temperaturtabell eller app.</li><li>Mät temperatur på sugledningen nära förångarens utlopp och på vätskeledningen före expansionsventilen.</li><li>Räkna ÖH och UK enligt formlerna.</li></ol>`},
{h:'Räkna själv',html:`__CALC__`},
{h:'Tolka avvikelser',html:`<div class="tblwrap"><table><thead><tr><th>Värde</th><th>Möjliga orsaker</th></tr></thead><tbody>
<tr><td>Hög ÖH</td><td>För lite köldmedium, igensatt filtertork eller vätskeledning, för stängd expansionsventil, stort tryckfall.</td></tr>
<tr><td>Låg ÖH</td><td>För öppen eller felinställd expansionsventil, för mycket köldmedium, dålig luftgenomströmning. Risk för vätskeslag.</td></tr>
<tr><td>Låg UK</td><td>För lite köldmedium (bubblor i siktglas), uppvärmd vätskeledning.</td></tr>
<tr><td>Hög UK</td><td>För mycket köldmedium som fyller kondensorn med vätska.</td></tr></tbody></table></div>`},
{h:'Egenkontroll av kyl- och värmepumpsaggregat',html:`<p>Verksamhetsutövare ska enligt miljöbalken och förordningen om egenkontroll (1998:901) känna till och kontrollera sin verksamhets miljöpåverkan. För en kylanläggning hör följande till rutinen:</p>
<ul class="checklist"><li>Läs av hög- och lågtryck samt temperaturer.</li><li>Beräkna överhettning och underkylning.</li><li>Kontrollera oljenivå och siktglas.</li><li>Sök efter läckage och följ intervallen för läckagekontroll.</li><li>Rengör kondensor och förångare. Kontrollera filter och avfrostning.</li><li>Kontrollera larm och pressostater.</li><li>För driftjournal över kontroller, åtgärder och mängd köldmedium.</li></ul>`}],

<script>
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={};
try{S=JSON.parse(localStorage.getItem('kylkurs-v1'))||{}}catch(e){S={}}
S.mods=S.mods||{};S.fin=S.fin||{mcq:[],txt:[],res:null};
const save=()=>{try{localStorage.setItem('kylkurs-v1',JSON.stringify(S))}catch(e){}};
const ms=id=>S.mods[id]||(S.mods[id]={mcq:[],txt:[],draw:{nodes:[],edges:[]},res:null});
const modById=id=>MODS.find(m=>m.id===id);

/* ---------- Rättning ---------- */
function gradeText(q,ans){
  const t=' '+String(ans||'').toLowerCase()+' ';
  const hit=[],missing=[];
  q.groups.forEach(g=>{(g.any.some(k=>t.includes(k))?hit:missing).push(g.l)});
  let p=0;
  if(t.trim().length>0){p=hit.length>=q.need?2:(hit.length>=Math.ceil(q.need/2)&&hit.length>0?1:0)}
  return{p,hit,missing};
}
function gradeDraw(task,d){
  const have=new Set(d.nodes.map(n=>n.n));
  const notes=[];
  const missingNodes=task.nodes.filter(n=>!have.has(n));
  const extraNodes=[...have].filter(n=>!task.nodes.includes(n));
  const se=new Set(d.edges.map(e=>e[0]+'>'+e[1]));
  let best=null;
  task.alts.forEach(alt=>{
    const ak=new Set(alt.map(e=>e[0]+'>'+e[1]));
    const ok=[...se].filter(k=>ak.has(k)).length;
    const wrong=[...se].filter(k=>!ak.has(k));
    const score=Math.max(0,ok-0.5*wrong.length)/alt.length;
    if(!best||score>best.score)best={score,ak,ok,wrong,alt};
  });
  let ratio=best.score-0.1*extraNodes.length-0.05*missingNodes.length;
  ratio=Math.max(0,Math.min(1,ratio));
  const points=Math.round(ratio*4);
  if(missingNodes.length)notes.push('Saknade komponenter: '+missingNodes.join(', ')+'.');
  if(extraNodes.length)notes.push('Komponenter som inte hör hemma i systemet: '+extraNodes.join(', ')+'.');
  const missingPipes=best.alt.filter(e=>!se.has(e[0]+'>'+e[1]));
  const reversed=[],other=[];
  best.wrong.forEach(k=>{const [a,b]=k.split('>');(best.ak.has(b+'>'+a)?reversed:other).push(a+' → '+b)});
  const trulyMissing=missingPipes.filter(e=>!se.has(e[1]+'>'+e[0]));
  if(reversed.length)notes.push('Fel flödesriktning på: '+reversed.join('; ')+'.');
  if(trulyMissing.length)notes.push('Saknade rör: '+trulyMissing.map(e=>e[0]+' → '+e[1]).join('; ')+'.');
  if(other.length)notes.push('Rör som inte hör hemma: '+other.join('; ')+'.');
  if(!notes.length)notes.push('Schemat är helt rätt.');
  return{p:points,max:4,notes};
}
function gradeModule(m){
  const st=ms(m.id);
  const res={mcq:{c:0,t:m.mcq.length,wrong:[]},txt:{p:0,t:m.txt.length*2,items:[]},draw:null};
  m.mcq.forEach((q,i)=>{if(st.mcq[i]===q.a)res.mcq.c++;else res.mcq.wrong.push(q.t)});
  m.txt.forEach((q,i)=>{const r=gradeText(q,st.txt[i]);res.txt.p+=r.p;res.txt.items.push(r)});
  if(m.draw)res.draw=gradeDraw(DRAW[m.draw],st.draw);
  st.res=res;save();
}
function pct(res){
  const got=res.mcq.c+res.txt.p+(res.draw?res.draw.p:0);
  const tot=res.mcq.t+res.txt.t+(res.draw?res.draw.max:0);
  return Math.round(100*got/tot);
}
function lvl(p){return p>=85?['Stark','lv-good']:p>=70?['Godkänd','lv-ok']:['Repetera','lv-low']}
function gradeFinal(){
  const f=S.fin;const by={};MODS.forEach(m=>by[m.id]={c:0,t:0,topics:[],miss:[]});
  FINAL.mcq.forEach((q,i)=>{const b=by[q.m];b.t++;if(f.mcq[i]===q.a)b.c++;else b.topics.push(q.t)});
  const items=[];
  FINAL.txt.forEach((q,i)=>{const r=gradeText(q,f.txt[i]);const b=by[q.m];b.t+=2;b.c+=r.p;b.miss.push(...r.missing);items.push(r)});
  let c=0,t=0;Object.values(by).forEach(b=>{c+=b.c;t+=b.t});
  f.res={by,items,pct:Math.round(100*c/t)};save();
}

/* ---------- Ritverktyg ---------- */
const NW=132,NH=44,VW=720,VH=400;
function mountDraw(host,key,st,locked){
  const T=DRAW[key],D=st.draw,pre='dr-'+key+'-';
  let mode='move',sel=null,pend=null,drag=null;
  const names=T.nodes.concat(T.extra);
  host.innerHTML=`<div class="dtools" role="toolbar" aria-label="Ritverktyg">
    <div class="grp" id="${pre}pal"></div>
    <div class="grp"><button type="button" class="btn alt sm" id="${pre}mv" aria-pressed="true">Flytta</button><button type="button" class="btn alt sm" id="${pre}pp" aria-pressed="false">Rita rör</button></div>
    <div class="grp"><button type="button" class="btn alt sm" id="${pre}del">Ta bort markerad</button><button type="button" class="btn alt sm" id="${pre}undo">Ångra rör</button><button type="button" class="btn alt sm" id="${pre}clr">Rensa allt</button></div></div>
  <p class="dhint" id="${pre}hint" aria-live="polite"></p>
  <svg class="canvas" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Rityta för kopplingsschema" id="${pre}svg"><g id="${pre}g"></g></svg>
  <div class="pipeform"><span>Alternativ utan mus:</span>
    <label for="${pre}from">Från</label><select id="${pre}from"></select>
    <label for="${pre}to">Till</label><select id="${pre}to"></select>
    <button type="button" class="btn alt sm" id="${pre}add">Lägg till rör</button></div>`;
  const $=id=>host.querySelector('#'+pre+id);
  const svg=$('svg'),g=$('g');
  const byName=()=>Object.fromEntries(D.nodes.map(n=>[n.n,n]));
  function pt(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height}}
  function edgePts(a,b,off){
    const ax=a.x+NW/2,ay=a.y+NH/2,bx=b.x+NW/2,by=b.y+NH/2;
    let dx=bx-ax,dy=by-ay;const len=Math.hypot(dx,dy)||1;
    const cut=(w,h)=>{const tx=dx?(w/2)/Math.abs(dx):1e9,ty=dy?(h/2)/Math.abs(dy):1e9;return Math.min(tx,ty)};
    const ca=cut(NW,NH),cb=cut(NW+8,NH+8);
    const nx=-dy/len*off,ny=dx/len*off;
    return[ax+dx*ca+nx,ay+dy*ca+ny,bx-dx*cb+nx,by-dy*cb+ny];
  }
  function paint(){
    const bn=byName();let h='';
    for(let x=40;x<VW;x+=40)h+=`<line class="gridl" x1="${x}" y1="0" x2="${x}" y2="${VH}"/>`;
    h+=`<defs><marker id="${pre}a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker><marker id="${pre}a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah2" d="M0 0L10 5L0 10z"/></marker></defs>`;
    D.edges.forEach(([a,b])=>{
      const A=bn[a],B=bn[b];if(!A||!B)return;
      const rev=D.edges.some(e=>e[0]===b&&e[1]===a);
      const p=edgePts(A,B,rev?6:0),k=a+'>'+b,s=sel&&sel.t==='e'&&sel.k===k;
      h+=`<g data-edge="${esc(k)}"><line class="hit" x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}"/><line class="pipe${s?' sel':''}" x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" marker-end="url(#${pre}${s?'a2':'a1'})"/></g>`;
    });
    D.nodes.forEach(n=>{
      const s=sel&&sel.t==='n'&&sel.k===n.n,pd=pend===n.n;
      h+=`<g data-node="${esc(n.n)}" transform="translate(${n.x} ${n.y})" style="cursor:${locked?'default':mode==='pipe'?'crosshair':'grab'}"><rect class="node${s?' sel':''}${pd?' pend':''}" width="${NW}" height="${NH}" rx="6"/><text x="${NW/2}" y="${NH/2+5}" text-anchor="middle">${esc(n.n)}</text></g>`;
    });
    g.innerHTML=h;
    // palett
    const placed=new Set(D.nodes.map(n=>n.n));
    $('pal').innerHTML=names.map(n=>`<button type="button" class="btn alt sm" data-add="${esc(n)}" ${placed.has(n)||locked?'disabled':''}>+ ${esc(n)}</button>`).join('');
    const opts=D.nodes.map(n=>`<option>${esc(n.n)}</option>`).join('');
    const f=$('from'),t=$('to'),fv=f.value,tv=t.value;f.innerHTML=opts;t.innerHTML=opts;
    if(fv)f.value=fv;if(tv)t.value=tv;
    $('mv').setAttribute('aria-pressed',mode==='move');$('pp').setAttribute('aria-pressed',mode==='pipe');
    $('mv').style.background=mode==='move'?'var(--soft)':'transparent';$('pp').style.background=mode==='pipe'?'var(--soft)':'transparent';
    host.querySelectorAll('.dtools button,.pipeform button,.pipeform select').forEach(b=>{if(locked)b.disabled=true});
    $('hint').textContent=locked?'Rättat. Välj Gör om delen för att rita på nytt.':mode==='pipe'?(pend?'Klicka på komponenten som röret ska gå till. Klicka på samma igen för att avbryta.':'Klicka på komponenten som röret ska börja vid.'):'Lägg till komponenter, dra dem på plats och välj sedan Rita rör.';
  }
  function addEdge(a,b){if(a===b||D.edges.some(e=>e[0]===a&&e[1]===b))return;D.edges.push([a,b]);save()}
  svg.addEventListener('pointerdown',e=>{
    if(locked)return;
    const ng=e.target.closest('[data-node]'),eg=e.target.closest('[data-edge]');
    if(ng){
      const name=ng.dataset.node;
      if(mode==='pipe'){if(!pend)pend=name;else if(pend===name)pend=null;else{addEdge(pend,name);pend=null}sel=null;paint();return}
      sel={t:'n',k:name};const p=pt(e),n=byName()[name];drag={name,dx:p.x-n.x,dy:p.y-n.y};
      try{svg.setPointerCapture(e.pointerId)}catch(x){}
      paint();
    }else if(eg&&mode==='move'){sel={t:'e',k:eg.dataset.edge};paint()}
    else{sel=null;pend=null;paint()}
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag)return;const p=pt(e),n=byName()[drag.name];if(!n)return;
    n.x=Math.max(0,Math.min(VW-NW,p.x-drag.dx));n.y=Math.max(0,Math.min(VH-NH,p.y-drag.dy));paint();
  });
  const end=()=>{if(drag){drag=null;save()}};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  host.addEventListener('click',e=>{
    if(locked)return;
    const add=e.target.closest('[data-add]');
    if(add){const n=add.dataset.add,c=D.nodes.length;D.nodes.push({n,x:40+(c%3)*252,y:30+Math.floor(c/3)*110});sel={t:'n',k:n};save();paint();return}
    const id=e.target.id||'';
    if(id===pre+'mv'){mode='move';pend=null;paint()}
    else if(id===pre+'pp'){mode='pipe';sel=null;paint()}
    else if(id===pre+'undo'){D.edges.pop();save();paint()}
    else if(id===pre+'clr'){D.nodes.length=0;D.edges.length=0;sel=null;pend=null;save();paint()}
    else if(id===pre+'del'&&sel){
      if(sel.t==='n'){D.nodes.splice(D.nodes.findIndex(n=>n.n===sel.k),1);for(let i=D.edges.length-1;i>=0;i--)if(D.edges[i][0]===sel.k||D.edges[i][1]===sel.k)D.edges.splice(i,1)}
      else{const [a,b]=sel.k.split('>');const i=D.edges.findIndex(x=>x[0]===a&&x[1]===b);if(i>=0)D.edges.splice(i,1)}
      sel=null;save();paint();
    }
    else if(id===pre+'add'){addEdge($('from').value,$('to').value);paint()}
  });
  paint();
}
</script>
<script>
'use strict';
const main=document.getElementById('main'),nav=document.getElementById('nav');
const bar=p=>`<div class="bar" role="img" aria-label="${p} procent"><span style="width:${p}%"></span></div>`;
const doneCount=()=>MODS.filter(m=>ms(m.id).res).length;
const linksHTML=ids=>`<section class="sources"><h2>Läs vidare i källorna</h2><ul>${ids.map(i=>`<li><a href="${esc(L[i].u)}" target="_blank" rel="noopener">${esc(L[i].t)}</a><span>${esc(L[i].d)}</span></li>`).join('')}</ul></section>`;

function paintChrome(route){
  const n=doneCount(),tot=MODS.length+1,fin=S.fin.res?1:0;
  const p=Math.round(100*(n+fin)/tot);
  document.getElementById('progtxt').textContent=(n+fin)+' av '+tot+' klara';
  document.querySelector('#progbar span').style.width=p+'%';
  const a=(h,t,r)=>`<a href="#${h}" ${route===h?'aria-current="page"':''}><span>${t}</span><span class="pc">${r||''}</span></a>`;
  nav.innerHTML=a('start','Start')+'<div class="sep"></div>'+MODS.map((m,i)=>{const r=ms(m.id).res;return a('del'+(i+1),'Del '+(i+1)+' '+esc(m.short),r?pct(r)+' %':'')}).join('')+'<div class="sep"></div>'+a('resultat','Mina resultat')+a('slutprov','Slutprov',S.fin.res?S.fin.res.pct+' %':'');
}

function viewStart(){
  main.innerHTML=`<p class="eyebrow">Kurs</p><h1>Kyl- och värmepumpsteknik</h1>
  <p class="lead">Kursen följer kylsystemets uppbyggnad och funktion, köldmedier och miljö, arbetsmiljö, driftövervakning, läcksökning samt mätning av överhettning och underkylning. Texterna länkar till svenska myndigheter, branschorganisationer och EU:s regelverk.</p>
  <h2>Så går det till</h2>
  <ol class="steps"><li>Läs delens text och öppna källorna för fördjupning.</li><li>Svara på kryssfrågor och textfrågor. Rita schemat där det finns en ritövning.</li><li>Klicka på Rätta delen. Rättningen sker direkt och du ser vad som saknas.</li><li>Under Mina resultat får du en analys av vad du behöver repetera.</li><li>När du är redo gör du slutprovet.</li></ol>
  <h2>Kursdelar</h2>
  <div class="cards">${MODS.map((m,i)=>{const r=ms(m.id).res;return `<a class="card" href="#del${i+1}"><span class="eyebrow">Del ${i+1}</span><b>${esc(m.title)}</b><span>${r?'Klar, '+pct(r)+' %':'Inte påbörjad eller inte rättad'}</span></a>`}).join('')}</div>
  <div class="note warn">Svaren sparas i din webbläsare på den här enheten. Länkarna går till externa sidor och kan ändras över tid. Kontrollera dem och kursens facit mot din kursplan.</div>`;
}

function mcqHTML(prefix,qs,answers,graded,start){
  return qs.map((q,i)=>{
    const a=answers[i],ok=a===q.a;
    return `<fieldset class="q"><legend><span class="qn">Fråga ${i+1+(start||0)}</span>${esc(q.q)}</legend>${q.o.map((o,j)=>{
      const cls=graded?(j===q.a?' right':(j===a?' wrong':'')):'';
      return `<label class="opt${cls}" for="${prefix}q${i}o${j}"><input type="radio" id="${prefix}q${i}o${j}" name="${prefix}q${i}" value="${j}" data-q="${i}" ${a===j?'checked':''} ${graded?'disabled':''}><span>${esc(o)}</span></label>`}).join('')}
    ${graded?`<p class="fb ${ok?'good':'bad'}"><b>${ok?'Rätt.':(a==null?'Obesvarad.':'Fel.')}</b> ${esc(q.e)}</p>`:''}</fieldset>`}).join('');
}
function txtHTML(prefix,qs,answers,items){
  return qs.map((q,i)=>{
    const r=items&&items[i];
    return `<div class="tq"><label for="${prefix}t${i}">${esc(q.q)}</label><textarea id="${prefix}t${i}" rows="5" data-t="${i}" ${r?'disabled':''}>${esc(answers[i]||'')}</textarea>
    ${r?`<p class="fb ${r.p===2?'good':'bad'}"><b>${r.p} av 2 poäng.</b></p><div class="chips">${r.hit.map(x=>`<span class="chip ok">Med: ${esc(x)}</span>`).join('')}${r.missing.map(x=>`<span class="chip no">Saknas: ${esc(x)}</span>`).join('')}</div><details><summary>Visa exempelsvar</summary><p>${esc(q.model)}</p></details><p class="dhint">Rättningen letar efter nyckelbegrepp. Ett svar med andra ord kan vara rätt, jämför med exempelsvaret.</p>`:''}</div>`}).join('');
}
function calcHTML(){
  const f=(id,l,v)=>`<div><label for="${id}">${l}</label><input type="number" id="${id}" value="${v}" step="0.5"></div>`;
  return `<div class="calc"><p>Skriv in temperaturer (°C) som du räknat fram ur trycken.</p><div class="calc-grid">${f('c-ev','Förångningstemperatur',-10)}${f('c-su','Sugledningstemperatur',-3)}${f('c-co','Kondenseringstemperatur',40)}${f('c-vl','Vätsketemperatur',35)}</div><output id="c-out" aria-live="polite"></output></div>`;
}
function wireCalc(){
  const g=id=>parseFloat(document.getElementById(id).value),out=document.getElementById('c-out');
  if(!out)return;
  const run=()=>{
    const oh=g('c-su')-g('c-ev'),uk=g('c-co')-g('c-vl');
    const a=isNaN(oh)?'–':oh<3?'mycket lågt, risk för vätskeslag':oh<5?'lågt':oh<=10?'inom riktvärdet':'högt';
    const b=isNaN(uk)?'–':uk<3?'lågt':uk<=8?'inom riktvärdet':'högt';
    out.innerHTML=`Överhettning: ${isNaN(oh)?'–':oh.toFixed(1)} K (${a})<br>Underkylning: ${isNaN(uk)?'–':uk.toFixed(1)} K (${b})<br><small>Riktvärden. Följ tillverkarens anvisningar.</small>`;
  };
  document.querySelectorAll('.calc input').forEach(i=>i.addEventListener('input',run));run();
}

function viewModule(i){
  const m=MODS[i],st=ms(m.id),res=st.res,graded=!!res;
  main.innerHTML=`<p class="eyebrow">Del ${i+1} av ${MODS.length}</p><h1>${esc(m.title)}</h1><p class="lead">${esc(m.intro)}</p>
  ${m.blocks.map(b=>`<section><h2>${esc(b.h)}</h2>${b.html==='__CALC__'?calcHTML():b.html}</section>`).join('')}
  ${linksHTML(m.links)}
  <section><h2>Kryssfrågor</h2>${mcqHTML(m.id,m.mcq,st.mcq,graded)}</section>
  <section><h2>Textfrågor</h2>${txtHTML(m.id,m.txt,st.txt,res&&res.txt.items)}</section>
  ${m.draw?`<section><h2>${esc(DRAW[m.draw].title)}</h2><p>${esc(DRAW[m.draw].brief)}</p><div id="drawhost"></div>${res&&res.draw?`<div class="fb ${res.draw.p>=3?'good':'bad'}"><b>Ritövning: ${res.draw.p} av ${res.draw.max} poäng.</b><ul>${res.draw.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}</section>`:''}
  <div class="submitbar">${graded?`<button class="btn alt" id="redo" type="button">Gör om delen</button>`:`<button class="btn" id="grade" type="button">Rätta delen</button>`}</div>
  ${graded?`<div class="sumbox" id="sum"><p class="eyebrow">Resultat för delen</p><div class="big">${pct(res)} %</div><p>Kryssfrågor ${res.mcq.c} av ${res.mcq.t}. Textfrågor ${res.txt.p} av ${res.txt.t}.${res.draw?` Ritövning ${res.draw.p} av ${res.draw.max}.`:''}</p><div class="submitbar"><a class="btn" href="#${i<MODS.length-1?'del'+(i+2):'resultat'}">${i<MODS.length-1?'Gå till nästa del':'Se mina resultat'}</a><a class="btn alt" href="#resultat">Mina resultat</a></div></div>`:''}`;
  if(m.calc)wireCalc();
  if(m.draw)mountDraw(document.getElementById('drawhost'),m.draw,st,graded);
  main.onchange=e=>{const q=e.target.dataset&&e.target.dataset.q;if(q!=null){st.mcq[+q]=+e.target.value;save()}};
  main.oninput=e=>{const t=e.target.dataset&&e.target.dataset.t;if(t!=null){st.txt[+t]=e.target.value;save()}};
  const gb=document.getElementById('grade');
  if(gb)gb.onclick=()=>{gradeModule(m);route(true);const s=document.getElementById('sum');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})};
  const rb=document.getElementById('redo');
  if(rb)rb.onclick=()=>{if(rb.dataset.arm){S.mods[m.id]=null;delete S.mods[m.id];save();route()}else{rb.dataset.arm='1';rb.textContent='Klicka igen för att rensa dina svar'}};
}

function improveList(){
  const out=[];
  MODS.forEach((m,i)=>{
    const r=ms(m.id).res;if(!r)return;const p=pct(r);if(p>=85)return;
    const bits=[];
    if(r.mcq.wrong.length)bits.push('Kryssfrågor att repetera: '+[...new Set(r.mcq.wrong)].join(', ')+'.');
    const miss=[].concat(...r.txt.items.map(x=>x.missing));
    if(miss.length)bits.push('Begrepp som saknades i textsvaren: '+miss.join('; ')+'.');
    if(r.draw&&r.draw.p<4)bits.push('Ritövning: '+r.draw.notes.join(' '));
    out.push({i,m,p,bits});
  });
  return out;
}
function viewResults(){
  const done=MODS.filter(m=>ms(m.id).res);
  if(!done.length){main.innerHTML=`<p class="eyebrow">Resultat</p><h1>Mina resultat</h1><p class="lead">Här visas dina resultat när du har rättat minst en del.</p><a class="btn" href="#del1">Börja med del 1</a>`;return}
  const avg=Math.round(done.reduce((s,m)=>s+pct(ms(m.id).res),0)/done.length);
  const imp=improveList();
  const all=done.length===MODS.length;
  main.innerHTML=`<p class="eyebrow">Resultat</p><h1>Mina resultat</h1>
  <div class="sumbox"><p class="eyebrow">Genomsnitt över ${done.length} av ${MODS.length} delar</p><div class="big">${avg} %</div>${bar(avg)}</div>
  <h2>Per del</h2>${MODS.map((m,i)=>{const r=ms(m.id).res;if(!r)return `<div class="rrow"><a href="#del${i+1}">Del ${i+1} ${esc(m.short)}</a><span class="st">Ej rättad</span><span></span></div>`;const p=pct(r),l=lvl(p);
    return `<div class="rrow"><a href="#del${i+1}">Del ${i+1} ${esc(m.short)}</a><span class="st">Kryss ${r.mcq.c}/${r.mcq.t} · Text ${r.txt.p}/${r.txt.t}${r.draw?` · Rita ${r.draw.p}/${r.draw.max}`:''}</span><span class="lv ${l[1]}">${l[0]} ${p} %</span>${bar(p)}</div>`}).join('')}
  <h2>Det här bör du förbättra</h2>
  ${imp.length?imp.sort((a,b)=>a.p-b.p).map(x=>`<div class="imp"><b>Del ${x.i+1} ${esc(x.m.short)} (${x.p} %)</b><ul>${x.bits.map(b=>`<li>${esc(b)}</li>`).join('')||'<li>Läs igenom delen en gång till.</li>'}</ul><a href="#del${x.i+1}">Gå till delen</a></div>`).join(''):'<p>Inget att förbättra bland de delar du rättat. Alla ligger på 85 % eller mer.</p>'}
  <h2>Nästa steg</h2>
  <p>${!all?'Gör klart de delar som saknas innan slutprovet.':avg>=FINAL.pass&&!imp.some(x=>x.p<FINAL.pass)?'Du ligger bra till. Du kan gå vidare till slutprovet.':'Repetera delarna med lägst resultat och gör om dem innan slutprovet.'}</p>
  <a class="btn" href="#slutprov">Till slutprovet</a>`;
}

function viewFinal(){
  const f=S.fin,res=f.res,graded=!!res,left=MODS.filter(m=>!ms(m.id).res);
  main.innerHTML=`<p class="eyebrow">Slutprov</p><h1>Slutprov</h1><p class="lead">${FINAL.mcq.length} kryssfrågor och ${FINAL.txt.length} textfrågor från alla delar. Gräns för godkänt: ${FINAL.pass} %.</p>
  ${left.length&&!graded?`<div class="note warn">Du har inte rättat ${left.length===1?'del':'delar'} ${left.map(m=>MODS.indexOf(m)+1).join(', ')} än. Det rekommenderas att göra alla delar före slutprovet.</div>`:''}
  <h2>Kryssfrågor</h2>${mcqHTML('f',FINAL.mcq,f.mcq,graded)}
  <h2>Textfrågor</h2>${txtHTML('f',FINAL.txt,f.txt,res&&res.items)}
  <div class="submitbar">${graded?`<button class="btn alt" id="fredo" type="button">Gör om slutprovet</button>`:`<button class="btn" id="fgrade" type="button">Rätta slutprovet</button>`}</div>
  ${graded?finalSummary(res):''}`;
  main.onchange=e=>{const q=e.target.dataset&&e.target.dataset.q;if(q!=null){f.mcq[+q]=+e.target.value;save()}};
  main.oninput=e=>{const t=e.target.dataset&&e.target.dataset.t;if(t!=null){f.txt[+t]=e.target.value;save()}};
  const gb=document.getElementById('fgrade');
  if(gb)gb.onclick=()=>{gradeFinal();route(true);const s=document.getElementById('fsum');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})};
  const rb=document.getElementById('fredo');
  if(rb)rb.onclick=()=>{if(rb.dataset.arm){S.fin={mcq:[],txt:[],res:null};save();route()}else{rb.dataset.arm='1';rb.textContent='Klicka igen för att rensa dina svar'}};
}
function finalSummary(res){
  const ok=res.pct>=FINAL.pass;
  return `<div class="sumbox" id="fsum"><p class="eyebrow">Resultat</p><div class="big">${res.pct} % · ${ok?'Godkänt':'Inte godkänt än'}</div>${bar(res.pct)}
  <h3>Per kursdel</h3>${MODS.map((m,i)=>{const b=res.by[m.id];if(!b.t)return '';const p=Math.round(100*b.c/b.t),l=lvl(p);
    const todo=[...new Set(b.topics)].concat(b.miss);
    return `<div class="rrow"><a href="#del${i+1}">Del ${i+1} ${esc(m.short)}</a><span class="st">${b.c} av ${b.t} poäng</span><span class="lv ${l[1]}">${l[0]} ${p} %</span>${bar(p)}${todo.length?`<p class="dhint" style="grid-column:1/-1">Repetera: ${esc(todo.join('; '))}</p>`:''}</div>`}).join('')}
  <p>${ok?'Bra jobbat. Delarna med lägst resultat är värda en repetition.':'Repetera delarna med lägst resultat och gör sedan om slutprovet.'}</p></div>`;
}

let cur=null;
function route(keep){
  const h=(location.hash||'#start').slice(1);
  const mm=/^del([1-9])$/.exec(h);
  let r='start';
  if(mm&&MODS[+mm[1]-1])r=h;else if(h==='resultat'||h==='slutprov')r=h;
  const fresh=r!==cur;cur=r;
  const y=window.scrollY;
  if(r==='start')viewStart();else if(r==='resultat')viewResults();else if(r==='slutprov')viewFinal();else viewModule(+r.slice(3)-1);
  paintChrome(r);
  if(fresh)window.scrollTo(0,0);else if(keep)window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>route());
document.getElementById('theme').addEventListener('click',()=>{
  const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  d.dataset.theme=dark?'light':'dark';
});
route();
</script>
